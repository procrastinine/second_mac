set -g mouse on
bind -n M-MouseDown1Pane run-shell -b '~/.local/share/agent-vm/alt-click.sh "#{mouse_x}" "#{mouse_y}" "#{cursor_x}" "#{cursor_y}" "#{pane_width}" "#{pane_id}" "#{pane_in_mode}" "#{alternate_on}"'
bind m set -g mouse \; display-message 'mouse: #{?mouse,on,off}'
bind -T root WheelUpPane if-shell -F -t = '#{pane_in_mode}' 'send-keys -M' 'copy-mode -et='
set -g history-limit 100000
set -sg escape-time 10
set -g renumber-windows on
set -g status-right '#H  %Y-%m-%d %H:%M'
setw -g monitor-activity on
set -g visual-activity on
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
if -F '#{>=:#{version},3.2}' 'set -s extended-keys on'
if -F '#{>=:#{version},3.2}' "set -as terminal-features ',xterm*:extkeys:RGB'"
if -F '#{>=:#{version},3.3}' 'set -g allow-passthrough on'
set -g set-titles on
set -g set-titles-string '#S:#W @ #H'
set -s focus-events on
# OSC 52 from deliberate tmux copying; do not accept app clipboard writes.
set -s set-clipboard external

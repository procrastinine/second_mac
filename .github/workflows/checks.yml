name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HOMEBREW_NO_ANALYTICS: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: brew install uv node go
      - run: ./tests/run.sh
      - run: /usr/bin/ruby tests/tart-ui-check.rb latest

name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HOMEBREW_NO_ANALYTICS: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: brew install uv node go
      - run: ./tests/run.sh
      - name: Check current Tart release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tart_release=$(gh api repos/openai/tart/releases/latest --jq '.tag_name')
          /usr/bin/ruby tests/tart-ui-check.rb "$tart_release"
